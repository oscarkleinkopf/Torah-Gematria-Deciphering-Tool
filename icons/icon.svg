<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140f2d" />
      <stop offset="70%" stop-color="#090616" />
      <stop offset="100%" stop-color="#04030a" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Cósmico Redondeado -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#d4af37" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Anillos Místicos de Frecuencia -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,8"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#00ced1" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Estrella de David Geométrica -->
  <!-- Triángulo Superior -->
  <polygon points="256,70 396,312 116,312" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round" opacity="0.85" />
  <!-- Triángulo Inferior -->
  <polygon points="256,442 396,200 116,200" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round" opacity="0.85" />

  <!-- Nodos de Esquina Celestes -->
  <circle cx="256" cy="70" r="6" fill="#00ced1" filter="url(#glow)" />
  <circle cx="396" cy="312" r="6" fill="#00ced1" filter="url(#glow)" />
  <circle cx="116" cy="312" r="6" fill="#00ced1" filter="url(#glow)" />
  <circle cx="256" cy="442" r="6" fill="#00ced1" filter="url(#glow)" />
  <circle cx="396" cy="200" r="6" fill="#00ced1" filter="url(#glow)" />
  <circle cx="116" cy="200" r="6" fill="#00ced1" filter="url(#glow)" />

  <!-- Letra Hebrea Alef Central (א) Estilizada en Oro Brillante -->
  <text x="256" y="305" font-family="'David', 'Times New Roman', serif" font-size="160" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">א</text>

  <!-- Puntos Sagrados / Partículas Cósmicas -->
  <circle cx="200" cy="150" r="2.5" fill="#ffffff" opacity="0.7" />
  <circle cx="320" cy="140" r="2" fill="#ffffff" opacity="0.6" />
  <circle cx="340" cy="370" r="2.5" fill="#ffffff" opacity="0.7" />
  <circle cx="170" cy="360" r="2" fill="#ffffff" opacity="0.5" />
</svg>
